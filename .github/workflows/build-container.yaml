name: Build & Publish Singularity

permissions:
  contents: write
  packages: write 

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install wheel

      - name: Build package
        run: |
          pip wheel --no-deps . -w wheelhouse/

      - name: Build Docker image for conversion
        run: |
          docker build . -t ghcr.io/altinlab/mdaf3:latest

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push Docker image
        if: github.event_name == 'push'
        run: |
          docker push ghcr.io/altinlab/mdaf3:latest

      - name: Install Apptainer (Singularity)
        if: github.event_name == 'push'
        run: |
          sudo add-apt-repository -y ppa:apptainer/ppa
          sudo apt update
          sudo apt install -y apptainer

      - name: Build Singularity .sif
        if: github.event_name == 'push'
        run: |
          apptainer build mdaf3.sif docker-daemon://ghcr.io/altinlab/mdaf3:latest

      - name: Create GitHub Release
        if: github.event_name == 'push'
        id: release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: test2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload .sif to Release
        if: github.event_name == 'push'
        uses: actions/upload-release-asset@v1
        with:
          upload_url: ${{ steps.release.outputs.upload_url }}
          asset_path: mdaf3.sif
          asset_name: mdaf3.sif
          asset_content_type: application/octet-stream
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}