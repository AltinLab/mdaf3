name: Build & Publish Singularity

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          pip install pipx

      - name: Build package
        run: |
          python -m pipx run build --sdist

      - name: Build Docker image for conversion
        run: |
          docker build . -t ghcr.io/altinlab/${{ github.repository }}:latest

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push Docker image
        if: github.event_name == 'push'
        run: |
          docker push ghcr.io/altinlab/${{ github.repository }}:latest

      - name: Install Apptainer (Singularity)
        if: github.event_name == 'push'
        run: |
          sudo apt-get update
          sudo apt-get install -y apptainer

      - name: Build Singularity .sif
        if: github.event_name == 'push'
        run: |
          apptainer build mypackage.sif docker-daemon://ghcr.io/altinlab/${{ github.repository }}:latest

      - name: Create GitHub Release
        if: github.event_name == 'push'
        id: release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.sha }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload .sif to Release
        if: github.event_name == 'push'
        uses: actions/upload-release-asset@v1
        with:
          upload_url: ${{ steps.release.outputs.upload_url }}
          asset_path: mdaf3.sif
          asset_name: mdaf3.sif
          asset_content_type: application/octet-stream
